name: Build and push container image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: |
          # Derive the image name from the repository that actually triggered the
          # build, so moving the repo between owners does not break the publish.
          # GHCR requires lowercase path components.
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source }}
